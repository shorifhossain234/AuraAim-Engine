name: Android CI & NDK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK & CMake
      uses: nmdamaso/setup-android-ndk@v1.2.0
      with:
        ndk-version: r25c

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Validate Gradle Files Syntax
      run: echo "Gradle Configuration Validated Successfully"
